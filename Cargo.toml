[package]
name = "noctoggle"
version = "0.1.0"
edition = "2024"
description = "Show the noctalia-shell topbar while a configurable key is held"
license = "MIT"

[[bin]]
name = "noctoggle"
path = "src/main.rs"

[dependencies]
evdev = { version = "0.12", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
